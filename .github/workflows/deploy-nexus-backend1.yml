name: Deploy nexus-backend1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: hdainexus.azurecr.io
          registryUsername: ${{ secrets.NEXUSBACKEND1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NEXUSBACKEND1_REGISTRY_PASSWORD }}
          containerAppName: nexus-backend1
          resourceGroup: Nexus
          imageToBuild: hdainexus.azurecr.io/hdai-backend:${{ github.sha }}
