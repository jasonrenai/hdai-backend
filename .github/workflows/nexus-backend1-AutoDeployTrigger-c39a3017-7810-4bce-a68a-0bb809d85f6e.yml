name: Trigger auto deployment for nexus-backend1

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/nexus-backend1-AutoDeployTrigger-c39a3017-7810-4bce-a68a-0bb809d85f6e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NEXUSBACKEND1_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NEXUSBACKEND1_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NEXUSBACKEND1_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: hdainexus.azurecr.io
          registryUsername: ${{ secrets.NEXUSBACKEND1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NEXUSBACKEND1_REGISTRY_PASSWORD }}
          containerAppName: nexus-backend1
          resourceGroup: Nexus
          imageToBuild: hdainexus.azurecr.io/nexus-backend1:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


